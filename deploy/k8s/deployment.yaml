apiVersion: apps/v1
kind: Deployment
metadata:
  name: devforge-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devforge-api
  template:
    metadata:
      labels:
        app: devforge-api
    spec:
      containers:
      - name: api
        image: devforge-ai/core:latest
        ports:
        - containerPort: 8000
